[project]
name = "omoonodes"
version = "0.1.0"
description = "Extra geometry nodes for Blender"
authors = [{ name = "Nan", email = "icrdr2010@outlook.com" }]
requires-python = ">=3.11.0"
readme = "README.md"
license = "MIT"

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
    "pytest-dependency>=0.6.0,<0.7",
    "pytest-cov>=5.0.0,<6",
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.30,<10",
    "autopep8>=2.3.1,<3",
    "mike>=2.1.2,<3",
    "tomlkit>=0.13.0,<0.14",
    "pip>=25.3",
    "mkdocs-static-i18n[material]>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
