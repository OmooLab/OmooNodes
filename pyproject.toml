[project]
name = "omoonodes"
version = "0.1.0"
description = "Python/Blender node conversion and asset library builds"
authors = [{ name = "Nan", email = "icrdr2010@outlook.com" }]
requires-python = ">=3.11"
readme = "src/omoonodes/README.md"
license = "GPL-3.0-or-later"
license-files = ["src/omoonodes/LICENSE", "src/omoonodes/NOTICE.md"]
dependencies = ["zstandard>=0.23,<1"]

[project.scripts]
omoonodes = "omoonodes.cli:main"

[project.urls]
Repository = "https://github.com/OmooLab/OmooNodes"

[dependency-groups]
dev = [
    "bpy==4.5.14; python_version == '3.11'",
    "pytest>=8.3.2,<9",
    "pytest-dependency>=0.6.0,<0.7",
    "pytest-cov>=5.0.0,<6",
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.30,<10",
    "autopep8>=2.3.1,<3",
    "mike>=2.1.2,<3",
    "tomlkit>=0.13.0,<0.14",
    "pip>=25.3",
    "mkdocs-static-i18n[material]>=1.3.1",
]

[tool.omoonodes]
targets = ["b45", "b52"]

[tool.omoonodes.contact]
name = "Nan"
url = "https://github.com/OmooLab/OmooNodes"
email = "studio@omoolab.xyz"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omoonodes"]

[tool.hatch.build.targets.sdist]
include = ["/src/omoonodes", "/pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
