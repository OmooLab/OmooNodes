[project]
name = "nodes-tool"
version = "0.1.0"
description = "Native Python and Blender node libraries"
authors = [{ name = "Nan", email = "icrdr2010@outlook.com" }]
requires-python = ">=3.11"
readme = "src/nodes_tool/README.md"
license = "GPL-3.0-or-later"
license-files = ["src/nodes_tool/LICENSE", "src/nodes_tool/NOTICE.md"]
dependencies = ["zstandard>=0.23,<1"]

[project.scripts]
nodes = "nodes_tool.cli:main"

[dependency-groups]
dev = [
    "bpy==4.5.14; python_version == '3.11'",
    "pytest>=8.3.2,<9",
    "pytest-dependency>=0.6.0,<0.7",
    "pytest-cov>=5.0.0,<6",
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.30,<10",
    "autopep8>=2.3.1,<3",
    "mike>=2.1.2,<3",
    "tomlkit>=0.13.0,<0.14",
    "pip>=25.3",
    "mkdocs-static-i18n[material]>=1.3.1",
]

[tool.nodes]
targets = ["b45", "b52"]

[tool.nodes.contact]
name = "Nan"
url = "https://git.omoolab.xyz/icrdr/OmooNodes"
email = "icrdr2010@outlook.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodes_tool"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
