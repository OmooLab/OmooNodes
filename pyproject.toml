[project]
name = "omoonodes"
version = "0.1.0"
description = "Extra geometry nodes for Blender"
authors = [{ name = "Nan", email = "icrdr2010@outlook.com" }]
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = "MIT"

[project.scripts]
docs = "tools.docs:main"
nodes = "tools.nodes.cli:main"

[dependency-groups]
dev = [
    "bpy==4.5.14",
    "pytest>=8.3.2,<9",
    "pytest-dependency>=0.6.0,<0.7",
    "pytest-cov>=5.0.0,<6",
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.30,<10",
    "autopep8>=2.3.1,<3",
    "mike>=2.1.2,<3",
    "tomlkit>=0.13.0,<0.14",
    "pip>=25.3",
    "mkdocs-static-i18n[material]>=1.3.1",
]

[tool.nodes]
targets = ["b45", "b52"]

[tool.nodes.contact]
name = "Nan"
url = "https://git.omoolab.xyz/icrdr/OmooNodes"
email = "icrdr2010@outlook.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
