name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        run: uv sync --python 3.11 --locked
      - name: Install bpy system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6
      - name: Test source
        run: uv run --python 3.11 pytest tests
      - name: Build
        run: uv build
      - name: Check installed packages
        run: |
          uv run --python 3.11 --isolated --no-project --with dist/*.whl omoonodes --help
          uv run --python 3.11 --isolated --no-project --with dist/*.tar.gz omoonodes --help
      - name: Publish
        run: uv publish
