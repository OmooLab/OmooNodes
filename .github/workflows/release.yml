name: Release

on:
  push:
    tags:
      - "nodes-v*"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: b45
            options: ""
          - target: b52
            options: --remote

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install bpy system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6
      - name: Build and package nodes
        run: |
          uv run --no-dev --locked omoonodes build --target ${{ matrix.target }} ${{ matrix.options }} -o dist
          cd dist/${{ matrix.target }}
          zip -r "../OmooNodes.${GITHUB_REF_NAME#nodes-}.${{ matrix.target }}.zip" .
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
