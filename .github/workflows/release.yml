name: Release

on:
  push:
    tags:
      - "nodes-v*"

permissions:
  contents: read

concurrency:
  group: nodes-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: b45
            options: ""
          - target: b52
            options: --remote

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install bpy system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6
      
      - name: Build and package nodes
        run: |
          uv run --no-dev --locked omoonodes build --target ${{ matrix.target }} ${{ matrix.options }} -o dist
          cd dist/${{ matrix.target }}
          zip -r "../OmooNodes.${GITHUB_REF_NAME#nodes-}.${{ matrix.target }}.zip" .
      
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nodes-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nodes-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
